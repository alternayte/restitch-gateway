# Production-shaped stack: gateway in REGISTRY mode against Studio, with
# Prometheus and Jaeger. This is the only place in the repo that exercises the
# M20 + M21 centralized-config loop as an operator would actually deploy it.
# examples/docker-compose/ remains the simple file-config quickstart.
name: restitch-deploy

services:
  studio:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${RESTITCH_IMAGE_TAG:-dev}
    # The Dockerfile's ENTRYPOINT is /restitch, so the studio binary must be
    # selected with `entrypoint`, NOT `command` — a `command` override would
    # run `/restitch /restitch-studio` and fail.
    entrypoint: ["/restitch-studio"]
    command:
      - "-port=3080"
      # The studio defaults to loopback (hardening C2); inside a container
      # that makes the SPA unreachable from the host and the registry
      # unreachable from the gateway, so the stack binds all interfaces.
      - "-bind=0.0.0.0"
      - "-db-path=/data/studio.db"
      - "-gateway-admin-url=http://gateway:9090"
      - "-registry-key=${RESTITCH_REGISTRY_KEY:-restitch-dev}"
      - "-admin-key=${RESTITCH_ADMIN_API_KEY:-restitch-dev}"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: restitch-studio
    volumes:
      - studio-data:/data
    ports:
      - "${STUDIO_PORT:-3080}:3080"
    depends_on:
      studio-data-init:
        condition: service_completed_successfully
    # Real HTTP probe (finding M17): the old `-h` probe always exited 0. The
    # SPA root answers 200 only when the studio is actually serving.
    healthcheck:
      test: ["CMD", "/restitch-studio", "-healthcheck", "http://localhost:3080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${RESTITCH_IMAGE_TAG:-dev}
    entrypoint: ["/restitch"]
    command:
      - "run"
      - "-registry-url=http://studio:3080"
      - "-registry-key=${RESTITCH_REGISTRY_KEY:-restitch-dev}"
      - "-poll-interval=10s"
      - "-port=8080"
      - "-log-format=json"
    environment:
      # In registry mode the whole gateway config comes from the registry
      # bundle, and a fresh Studio has no configs. Setting the admin server
      # through env vars means /metrics is up regardless of bundle contents,
      # so Prometheus has something to scrape from the first second.
      # The admin key is required since hardening C3; the studio proxy sends
      # the same value as X-Admin-Key.
      RESTITCH_ADMIN_ENABLED: "true"
      RESTITCH_ADMIN_PORT: "9090"
      # The admin server defaults to loopback (hardening C3); inside a
      # container that would make /metrics unreachable from Prometheus and
      # the host port mapping dead, so the stack binds all interfaces.
      RESTITCH_ADMIN_BIND: "0.0.0.0"
      RESTITCH_ADMIN_API_KEY: ${RESTITCH_ADMIN_API_KEY:-restitch-dev}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: restitch-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
      - "${GATEWAY_ADMIN_PORT:-9090}:9090"
    depends_on:
      studio:
        condition: service_healthy
    # The initial registry fetch is fatal if the studio is not yet listening
    # (a startup race), so the gateway retries until it succeeds.
    restart: on-failure
    # Real HTTP probe (finding M17): the gateway had no probe at all.
    healthcheck:
      test: ["CMD", "/restitch", "healthcheck", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The image runs as the distroless nonroot user (finding H7). Docker
  # initializes a fresh named volume with a root-owned 0755 root directory,
  # which that user cannot write; this one-shot step fixes the ownership
  # before the studio opens its database.
  studio-data-init:
    image: alpine:3.20
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - studio-data:/data
    restart: "no"

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # Prometheus binds its conventional 9090 INSIDE the network, but the
    # gateway admin server already owns 9090 on the host, so the host side
    # comes from PROMETHEUS_PORT (9091 by default).
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - gateway

  jaeger:
    image: jaegertracing/all-in-one:${JAEGER_VERSION}
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"

volumes:
  studio-data:
  prometheus-data:
