# Studio on Postgres, two managed gateways in one environment, a mock
# upstream and Prometheus. deploy/README.md describes the two-step bring-up:
# Studio first, then the gateways once a gateway token exists.
#
# No secret is committed. POSTGRES_PASSWORD and the bootstrap owner must be
# set in deploy/.env; the gateways stay down until RESTITCH_GATEWAY_TOKEN is.
name: restitch

x-restitch-build: &restitch-build
  context: ..
  dockerfile: Dockerfile
  args:
    VERSION: ${RESTITCH_IMAGE_TAG:-dev}

x-gateway: &gateway
  build: *restitch-build
  image: restitch:${RESTITCH_IMAGE_TAG:-dev}
  command: ["gateway"]
  environment: &gateway-env
    RESTITCH_STUDIO_URL: http://studio:3080
    # Empty until step two of the bring-up. The gateway exits with an error
    # that names the variable, and restarts give up after five attempts.
    RESTITCH_GATEWAY_TOKEN: ${RESTITCH_GATEWAY_TOKEN:-}
    RESTITCH_OPS_PORT: "9090"
  restart: on-failure:5
  depends_on:
    studio:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/restitch", "healthcheck", "http://localhost:8080/ready"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    environment:
      POSTGRES_DB: restitch
      POSTGRES_USER: restitch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "restitch", "-d", "restitch"]
      interval: 2s
      timeout: 5s
      retries: 15

  studio:
    build: *restitch-build
    image: restitch:${RESTITCH_IMAGE_TAG:-dev}
    command: ["studio"]
    environment:
      RESTITCH_DATABASE_URL: postgres://restitch:${POSTGRES_PASSWORD}@postgres:5432/restitch?sslmode=disable
      RESTITCH_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://localhost:3080}
      RESTITCH_BOOTSTRAP_EMAIL: ${RESTITCH_BOOTSTRAP_EMAIL:?set RESTITCH_BOOTSTRAP_EMAIL in deploy/.env}
      RESTITCH_BOOTSTRAP_PASSWORD: ${RESTITCH_BOOTSTRAP_PASSWORD:?set RESTITCH_BOOTSTRAP_PASSWORD in deploy/.env}
    ports:
      - "${STUDIO_PORT:-3080}:3080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/restitch", "healthcheck", "http://localhost:3080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway-1:
    <<: *gateway
    ports:
      - "${GATEWAY_1_PORT:-8080}:8080"

  gateway-2:
    <<: *gateway
    ports:
      - "${GATEWAY_2_PORT:-8082}:8080"

  # Demo backend, reachable from the gateways as http://mockupstream:8081.
  mockupstream:
    build:
      <<: *restitch-build
      target: mockupstream
    image: restitch-mockupstream:${RESTITCH_IMAGE_TAG:-dev}
    command: ["-port", "8081"]

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.13.1}
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"

volumes:
  postgres-data:
  prometheus-data:
