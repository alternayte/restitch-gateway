# A standalone gateway: one artifact file, no Studio. The gateway reloads the
# file when it changes. For Studio with managed gateways, see deploy/.
services:
  mockupstream:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mockupstream
    command: ["-port", "8081"]

  gateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["gateway"]
    environment:
      RESTITCH_CONFIG: /etc/restitch/restitch.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./restitch.yaml:/etc/restitch/restitch.yaml:ro
    depends_on:
      - mockupstream
