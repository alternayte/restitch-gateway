services:
  mockupstream:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["/mockupstream"]
    command: ["-port", "8081"]
    ports:
      - "8081:8081"

  restitch:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["run", "-config", "/etc/restitch/restitch.yaml"]
    environment:
      # The gateway admin server defaults to loopback (hardening C3); inside
      # a container that makes :9090 unreachable from the host and the Studio
      # proxy. The admin key is required, so the Studio proxy gets the same
      # value via STUDIO_ADMIN_KEY.
      RESTITCH_ADMIN_BIND: "0.0.0.0"
      RESTITCH_ADMIN_API_KEY: "restitch-dev"
    ports:
      - "8080:8080"
      - "9090:9090"
    volumes:
      - ./restitch.yaml:/etc/restitch/restitch.yaml:ro
    depends_on:
      - mockupstream

  restitch-studio:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["/restitch-studio"]
    command:
      - "-port=3080"
      - "-gateway-admin-url=http://restitch:9090"
      - "-admin-key=restitch-dev"
    environment:
      # The Studio defaults to loopback (hardening C2); inside a container
      # that makes the SPA unreachable from the host.
      STUDIO_BIND: "0.0.0.0"
    ports:
      - "3080:3080"
    depends_on:
      - restitch
