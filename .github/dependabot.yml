# Actions are pinned to full commit SHAs (finding M20). Dependabot proposes
# the new SHA when a new major ships; a human reviews before merging.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/studio"
    schedule:
      interval: "weekly"
