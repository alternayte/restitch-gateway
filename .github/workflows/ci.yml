name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - run: go test -race ./...

      - run: go build ./...

      - name: Coverage check
        run: |
          go test -coverprofile=coverage.out ./internal/...
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          if [ "$(echo "$TOTAL < 70" | bc -l)" = "1" ]; then
            echo "Coverage ${TOTAL}% is below 70% threshold"
            exit 1
          fi

  studio:
    runs-on: ubuntu-latest
    if: hashFiles('studio/package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci
        working-directory: studio

      - name: Test
        run: |
          if npm run --silent test -- --passWithNoTests 2>/dev/null; then
            echo "Tests passed"
          else
            echo "No test script or tests skipped"
          fi
        working-directory: studio
        continue-on-error: true

      - run: npm run build
        working-directory: studio

  docker:
    runs-on: ubuntu-latest
    if: hashFiles('Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t restitch:ci .
