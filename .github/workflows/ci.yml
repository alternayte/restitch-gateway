name: CI

on:
  # Scoped deliberately. An unrestricted `push:` fires alongside
  # `pull_request:` for every branch that has an open PR, running the whole
  # suite twice on the same commit. Pushes now cover only the branches that
  # have no PR to run them — the trunk, release branches and tags — and
  # everything else is covered by the pull_request trigger.
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A second push to a branch supersedes the first; cancel the in-flight run
# rather than paying for a result nobody will read. Release branches and tags
# are excluded so a run that gates a shipping artifact always completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/tags/') }}

# Least privilege (finding M23): no job needs write access.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json

      # cmd/restitch-studio embeds dist/, which is a build artifact and not
      # committed (finding M36); a fresh clone needs the frontend first.
      - run: npm ci && npm run build
        working-directory: studio

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # gofmt enforcement (finding M35): unformatted Go files fail the job.
      - name: gofmt check
        run: test -z "$(gofmt -l .)" || { echo "unformatted files:"; gofmt -l .; exit 1; }

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9

      - name: Test
        run: go test -race -json ./... > test-results.json || { cat test-results.json; exit 1; }

      - run: go build ./...

      - name: Coverage check
        run: |
          # Deliberate scope (finding M19): ./internal/... only. The cmd/
          # packages are thin CLI glue and pull the whole-tree number below
          # the 70% bar (measured 64.6% on 2026-09-02); the threshold exists
          # to guard the data-plane logic, which lives in internal/.
          go test -coverprofile=coverage.out ./internal/...
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          # awk, not bc: GitHub-hosted ubuntu-latest runners do not ship bc,
          # so the old comparison failed every run (finding H6).
          if awk 'BEGIN { exit !('"$TOTAL"' >= 70) }'; then
            echo "Coverage ${TOTAL}% is at or above the 70% threshold"
          else
            echo "Coverage ${TOTAL}% is below 70% threshold"
            exit 1
          fi

      # Coverage was computed and then discarded (finding M24). Upload the
      # profile and the test results so failures can be inspected.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-test-results
          path: test-results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 20 reached end of life in April 2026. 24 is the active LTS and
          # is much closer to what this project is developed on, which matters:
          # a Node-version gap between local and CI is what let an invalid
          # NODE_OPTIONS flag reach CI and hang this job for 9 minutes.
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - run: npm ci
        working-directory: studio

      - name: Test
        # --passWithNoTests was dropped (finding M18): the Studio now has
        # real tests, and an empty suite must fail rather than pass.
        run: npm run test
        working-directory: studio

      - run: npm run build
        working-directory: studio

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build Docker image
        run: docker build -t restitch:ci .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      # Race detector and an explicit timeout (finding M22): the old job ran
      # bare, so a deadlock could hang the job until GitHub's global cap.
      - run: go test -race -tags e2e ./tests/... -count=1 -v -timeout 10m

  loadtest:
    # Release branches and tags only. A hard latency threshold on every push
    # would flake on shared-runner noise; here it gates the things that ship.
    # workflow_dispatch allows a manual run on any branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Build binaries
        run: |
          go build -o bin/restitch ./cmd/restitch
          go build -o bin/mockupstream ./cmd/mockupstream

      # Binaries, not compose: this measures gateway throughput, and putting
      # Docker networking between k6 and the gateway would measure the bridge.
      - name: Start mockupstream and gateway
        run: |
          ./bin/mockupstream -port 18081 &
          cat > /tmp/ci_load.yaml <<'YAML'
          upstreams:
            mock:
              url: "http://127.0.0.1:18081"
              timeout: 10s
              transport:
                max_idle_conns_per_host: 100
          compositions:
            loadtest:
              path: "/loadtest"
              method: GET
              steps:
                - name: s1
                  upstream: mock
                  path: "/users/1"
              response:
                body:
                  name: "{{ steps.s1.body.name }}"
          YAML
          ./bin/restitch run -config /tmp/ci_load.yaml -port 18080 -log-format json &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:18080/loadtest >/dev/null && break
            sleep 1
          done

      # Reduced profile: a 2-core shared runner cannot honestly sustain the
      # gate's 1000/s. STUDIO_URL is intentionally unset, so the k6 script
      # omits its studio scenario entirely.
      - name: Run k6 load test
        env:
          RATE: "200"
          DURATION: "30s"
          # Derived from a real workflow_dispatch run on a GitHub shared runner
          # (2026-07-28): p95 0.730091ms, error_rate 0, reqs 6001 against an
          # offered 200/s x 30s, so the gateway sustained the full rate.
          # ceil(0.730091 * 2 / 50) * 50 = 50, the formula's floor bucket.
          #
          # That leaves ~68x headroom over the measurement, which is deliberate:
          # the doubling absorbs shared-runner noise, and this job exists to
          # catch gross regressions (a connection-pool or fan-out collapse of
          # the kind M23 fixed), not to certify latency. It is not a production
          # performance claim — the profile is reduced precisely because a
          # 2-core shared runner cannot honestly sustain the gate's 1000/s.
          P95_MS: "50"
          ERR_RATE: "0.01"
          GW_URL: "http://127.0.0.1:18080/loadtest"
          SUMMARY_OUT: "/tmp/m24_ci_summary.json"
        run: k6 run tests/loadtest/m24_baseline.js

      - name: Show summary
        if: always()
        run: cat /tmp/m24_ci_summary.json || echo "no summary produced"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: k6-summary
          path: /tmp/m24_ci_summary.json
