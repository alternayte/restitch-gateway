components:
  schemas:
    APIKey:
      properties:
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        lastUsedAt:
          format: date-time
          type: string
        name:
          type: string
        orgId:
          type: string
        revokedAt:
          format: date-time
          type: string
        role:
          type: string
        start:
          type: string
        userId:
          type: string
      required:
        - id
        - name
        - start
        - role
        - createdAt
      type: object
    APIKeyCreateResponse:
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        plaintext:
          type: string
      required:
        - key
        - plaintext
      type: object
    APIKeyListResponse:
      properties:
        keys:
          items:
            $ref: "#/components/schemas/APIKey"
          type: array
      required:
        - keys
      type: object
    AdminCreateUserResponse:
      properties:
        temporaryPassword:
          type: string
        user:
          $ref: "#/components/schemas/AdminUser"
      required:
        - user
      type: object
    AdminPasswordResponse:
      properties:
        temporaryPassword:
          type: string
      type: object
    AdminUser:
      properties:
        createdAt:
          format: date-time
          type: string
        disabledAt:
          format: date-time
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        id:
          type: string
        mustChangePassword:
          type: boolean
        name:
          type: string
        role:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - email
        - emailVerified
        - name
        - role
        - mustChangePassword
        - createdAt
        - updatedAt
      type: object
    AdminUserListResponse:
      properties:
        nextCursor:
          type: string
        users:
          items:
            $ref: "#/components/schemas/AdminUser"
          type: array
      required:
        - users
        - nextCursor
      type: object
    AdminUserResponse:
      properties:
        user:
          $ref: "#/components/schemas/AdminUser"
      required:
        - user
      type: object
    ArtifactVersion:
      additionalProperties: false
      properties:
        author:
          type: string
        created_at:
          format: date-time
          type: string
        message:
          type: string
        number:
          format: int64
          type: integer
        yaml:
          type: string
      required:
        - number
        - author
        - message
        - created_at
      type: object
    AuthResponse:
      properties:
        emailVerificationRequired:
          type: boolean
        mfaRequired:
          type: boolean
        mfaToken:
          type: string
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - session
      type: object
    CreateEnvironmentRequest:
      additionalProperties: false
      properties:
        name:
          pattern: ^[a-z][a-z0-9-]{0,62}$
          type: string
      required:
        - name
      type: object
    DeleteResponse:
      properties:
        confirmationRequired:
          type: boolean
        success:
          type: boolean
      required:
        - success
      type: object
    Environment:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        name:
          type: string
      required:
        - name
        - created_at
        - created_by
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    ErrorResponse:
      properties:
        error:
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
          type: object
      required:
        - error
      type: object
    GatewayToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        created_by:
          type: string
        id:
          type: string
        last_used_at:
          format: date-time
          type: string
        name:
          type: string
        prefix:
          description: The first characters of the token, to tell tokens apart.
          type: string
        revoked_at:
          format: date-time
          type: string
      required:
        - id
        - name
        - prefix
        - created_at
        - created_by
      type: object
    Instance:
      additionalProperties: false
      properties:
        applied_version:
          format: int64
          type: integer
        binary_version:
          type: string
        first_seen_at:
          format: date-time
          type: string
        instance_id:
          type: string
        last_pull_error:
          type: string
        last_seen_at:
          format: date-time
          type: string
        stale:
          description: No heartbeat for a minute or more.
          type: boolean
      required:
        - first_seen_at
        - last_seen_at
        - stale
        - instance_id
        - binary_version
        - applied_version
      type: object
    IssueGatewayTokenRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
      required:
        - name
      type: object
    IssueGatewayTokenResponse:
      additionalProperties: false
      properties:
        token:
          type: string
      required:
        - token
      type: object
    ListEnvironmentsResponse:
      additionalProperties: false
      properties:
        environments:
          items:
            $ref: "#/components/schemas/Environment"
          type:
            - array
            - "null"
      required:
        - environments
      type: object
    ListGatewayTokensResponse:
      additionalProperties: false
      properties:
        tokens:
          items:
            $ref: "#/components/schemas/GatewayToken"
          type:
            - array
            - "null"
      required:
        - tokens
      type: object
    ListInstancesResponse:
      additionalProperties: false
      properties:
        current_version:
          format: int64
          type: integer
        instances:
          items:
            $ref: "#/components/schemas/Instance"
          type:
            - array
            - "null"
      required:
        - current_version
        - instances
      type: object
    ListResourcesResponse:
      additionalProperties: false
      properties:
        resources:
          items:
            $ref: "#/components/schemas/Resource"
          type:
            - array
            - "null"
      required:
        - resources
      type: object
    ListVersionsResponse:
      additionalProperties: false
      properties:
        versions:
          items:
            $ref: "#/components/schemas/ArtifactVersion"
          type:
            - array
            - "null"
      required:
        - versions
      type: object
    MeOutputBody:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        name:
          type: string
        role:
          enum:
            - viewer
            - editor
            - owner
          type: string
      required:
        - id
        - email
        - role
      type: object
    MessageResponse:
      properties:
        message:
          type: string
      required:
        - message
      type: object
    PreferencesBody:
      additionalProperties: false
      properties:
        default_range:
          maxLength: 16
          type: string
        last_environment:
          maxLength: 128
          type: string
        pinned_names:
          items:
            type: string
          maxItems: 100
          type:
            - array
            - "null"
        sidebar_closed:
          type: boolean
        theme:
          enum:
            - light
            - dark
            - system
          type: string
      type: object
    PreviewBody:
      additionalProperties: false
      properties:
        current_version:
          description: 0 when the environment has no version yet.
          format: int64
          type: integer
        diff:
          description: Unified diff from the current version to the draft. Empty when they match.
          type: string
        errors:
          items:
            type: string
          type:
            - array
            - "null"
        valid:
          type: boolean
        yaml:
          type: string
      required:
        - valid
        - errors
        - yaml
        - diff
        - current_version
      type: object
    PromoteRequest:
      additionalProperties: false
      properties:
        from_environment:
          type: string
        version:
          format: int64
          minimum: 1
          type: integer
      required:
        - from_environment
        - version
      type: object
    PromoteResponse:
      additionalProperties: false
      properties:
        diff:
          type: string
      required:
        - diff
      type: object
    PublishRequest:
      additionalProperties: false
      properties:
        message:
          maxLength: 1000
          minLength: 1
          type: string
      required:
        - message
      type: object
    Resource:
      additionalProperties: false
      properties:
        body:
          additionalProperties: {}
          type: object
        kind:
          enum:
            - upstream
            - composition
            - auth
            - rate_limit
            - settings
          type: string
        name:
          type: string
        revision:
          description: Increases by one on every save.
          format: int64
          type: integer
        updated_at:
          format: date-time
          type: string
        updated_by:
          type: string
      required:
        - kind
        - name
        - revision
        - body
        - updated_at
        - updated_by
      type: object
    RevokeAllResponse:
      properties:
        revoked:
          type: integer
      required:
        - revoked
      type: object
    SaveResourceRequest:
      additionalProperties: false
      properties:
        base_revision:
          format: int64
          minimum: 0
          type: integer
        body:
          additionalProperties: {}
          type: object
      required:
        - base_revision
        - body
      type: object
    Session:
      properties:
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        userId:
          type: string
      required:
        - id
        - userId
        - createdAt
        - expiresAt
      type: object
    SessionEntry:
      properties:
        createdAt:
          format: date-time
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        lastSeenAt:
          format: date-time
          type: string
      required:
        - id
        - createdAt
        - expiresAt
        - lastSeenAt
      type: object
    SessionListResponse:
      properties:
        sessions:
          items:
            $ref: "#/components/schemas/SessionEntry"
          type: array
      required:
        - sessions
      type: object
    SessionResponse:
      properties:
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/User"
      required:
        - user
        - session
      type: object
    SuccessResponse:
      properties:
        success:
          type: boolean
      required:
        - success
      type: object
    UsageBody:
      additionalProperties: false
      properties:
        buckets:
          items:
            $ref: "#/components/schemas/UsageBucket"
          type:
            - array
            - "null"
        latency_bounds_ms:
          items:
            format: double
            type: number
          type:
            - array
            - "null"
        upstreams:
          items:
            $ref: "#/components/schemas/UsageUpstream"
          type:
            - array
            - "null"
      required:
        - latency_bounds_ms
        - buckets
        - upstreams
      type: object
    UsageBucket:
      additionalProperties: false
      properties:
        errors:
          format: int64
          type: integer
        latency_buckets:
          description: Request counts per latency bound in latency_bounds_ms, plus one overflow bucket.
          items:
            format: int64
            type: integer
          type:
            - array
            - "null"
        p95_ms:
          description: Upper bound of the latency bucket that holds the 95th percentile.
          format: double
          type: number
        partials:
          format: int64
          type: integer
        requests:
          format: int64
          type: integer
        steps:
          additionalProperties:
            $ref: "#/components/schemas/UsageStep"
          type: object
        timestamp:
          format: date-time
          type: string
      required:
        - timestamp
        - requests
        - errors
        - partials
        - latency_buckets
        - p95_ms
        - steps
      type: object
    UsageStep:
      additionalProperties: false
      properties:
        avg_ms:
          description: Mean across instances, weighted by requests.
          format: double
          type: number
        cache_hits:
          format: int64
          type: integer
        errors:
          format: int64
          type: integer
        requests:
          format: int64
          type: integer
        upstream:
          type: string
      required:
        - upstream
        - requests
        - errors
        - cache_hits
        - avg_ms
      type: object
    UsageUpstream:
      additionalProperties: false
      properties:
        breakers:
          additionalProperties:
            type: string
          description: Breaker state per gateway instance.
          type: object
        errors:
          format: int64
          type: integer
        name:
          type: string
        requests:
          format: int64
          type: integer
      required:
        - name
        - requests
        - errors
        - breakers
      type: object
    User:
      properties:
        createdAt:
          format: date-time
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        id:
          type: string
        image:
          type: string
        name:
          type: string
        role:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - email
        - emailVerified
        - name
        - image
        - createdAt
        - updatedAt
      type: object
info:
  title: Restitch Studio
  version: dev
openapi: 3.1.0
paths:
  /api/auth/admin/users:
    get:
      operationId: adminListUsers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserListResponse"
          description: The operation succeeded
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: List the users
      tags:
        - admin
    post:
      operationId: adminCreateUser
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                name:
                  type: string
                password:
                  type: string
                role:
                  type: string
                temporaryPassword:
                  type: boolean
              required:
                - email
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreateUserResponse"
          description: The operation succeeded
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Create a user
      tags:
        - admin
  /api/auth/admin/users/{id}/disable:
    post:
      operationId: adminDisableUser
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
          description: The operation succeeded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Disable a user
      tags:
        - admin
  /api/auth/admin/users/{id}/enable:
    post:
      operationId: adminEnableUser
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
          description: The operation succeeded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Enable a user
      tags:
        - admin
  /api/auth/admin/users/{id}/password:
    post:
      operationId: adminResetUserPassword
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                password:
                  type: string
                temporary:
                  type: boolean
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPasswordResponse"
          description: The operation succeeded
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Set a new password for a user
      tags:
        - admin
  /api/auth/admin/users/{id}/role:
    post:
      operationId: adminSetUserRole
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                role:
                  type: string
              required:
                - role
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
          description: The operation succeeded
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Set the role of a user
      tags:
        - admin
  /api/auth/api-keys:
    get:
      operationId: listAPIKeys
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListResponse"
          description: The operation succeeded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: List the API keys
      tags:
        - api-keys
    post:
      operationId: createAPIKey
      requestBody:
        content:
          application/json:
            schema:
              properties:
                expiresAt:
                  format: date-time
                  type: string
                name:
                  type: string
                orgId:
                  type: string
                role:
                  type: string
              required:
                - name
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreateResponse"
          description: The operation succeeded
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Create an API key
      tags:
        - api-keys
  /api/auth/api-keys/{id}/revoke:
    post:
      operationId: revokeAPIKey
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
          description: The operation succeeded
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Revoke an API key
      tags:
        - api-keys
  /api/auth/email-verification/send:
    post:
      operationId: emailVerificationSend
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                redirectTo:
                  type: string
              required:
                - email
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
          description: An enumeration-safe acknowledgement
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Auth-All error
      summary: Request an email verification message
      tags:
        - email-password
  /api/auth/email-verification/verify:
    post:
      operationId: emailVerificationVerify
      requestBody:
